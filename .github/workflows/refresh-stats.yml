name: Refresh YouTube stats

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: python -m pip install --quiet --upgrade "yt-dlp[default]"

      - name: Fetch public counts (yt-dlp, RSS fallback)
        env:
          STATS_OUT: stats.json
          STATS_FETCHED_BY: github-action
        run: python .github/scripts/refresh-stats.py

      - name: Commit stats.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh stats.json (Action)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done

      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
